name: App de escritorio (Windows y Linux)

# Compila MarCNC para Windows (.exe portable e instalador) y Linux (.deb y AppImage).
# Con una etiqueta v* (p. ej. v0.3.0) además publica un Release con todos los archivos.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles nsis
      - name: Reunir archivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force salida | Out-Null
          Copy-Item src-tauri/target/release/marcnc.exe salida/MarCNC-portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe salida/
          Get-ChildItem salida
      - uses: actions/upload-artifact@v4
        with:
          name: MarCNC-windows
          path: salida/*

  # Ubuntu 22.04: el paquete usa bibliotecas de esa versión y así funciona en Ubuntu 22.04/24.04 y Linux Mint 21/22
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles deb,appimage
      - name: Reunir archivos
        run: |
          mkdir -p salida
          cp src-tauri/target/release/bundle/deb/*.deb salida/
          cp src-tauri/target/release/bundle/appimage/*.AppImage salida/
          ls -l salida
      - uses: actions/upload-artifact@v4
        with:
          name: MarCNC-linux
          path: salida/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" salida/* --repo "${{ github.repository }}" --title "MarCNC ${{ github.ref_name }}" --generate-notes
