name: App de escritorio (Windows y Linux)

# Compila MarCNC para Windows (.exe portable e instalador) y Linux (.deb y AppImage).
# Solo corre con una etiqueta v* (p. ej. v1.0.0), que además publica un Release,
# o a mano desde la pestaña Actions. No compila en cada push para no llenar el
# almacenamiento de Actions.
# Con etiqueta, los paquetes van directo a un Release en borrador (sin artefactos, que
# tienen cuota) y el Release se publica cuando las dos compilaciones terminaron.
# A mano no hay Release: los paquetes quedan como artefactos por un día.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # crea el Release en borrador (si ya existe, de un intento anterior, lo reutiliza)
  borrador:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --verify-tag \
              --title "MarCNC ${{ github.ref_name }}" --generate-notes

  windows:
    needs: [borrador]
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles nsis
      - name: Reunir archivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force salida | Out-Null
          Copy-Item src-tauri/target/release/marcnc.exe salida/MarCNC-portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe salida/
          Get-ChildItem salida
      - name: Subir al Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" salida/* --clobber --repo "${{ github.repository }}"
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: MarCNC-windows
          path: salida/*
          retention-days: 1

  # Ubuntu 22.04: el paquete usa bibliotecas de esa versión y así funciona en Ubuntu 22.04/24.04 y Linux Mint 21/22
  linux:
    needs: [borrador]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotecas de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles deb,appimage
      - name: Reunir archivos
        run: |
          mkdir -p salida
          cp src-tauri/target/release/bundle/deb/*.deb salida/
          cp src-tauri/target/release/bundle/appimage/*.AppImage salida/
          ls -l salida
      - name: Subir al Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" salida/* --clobber --repo "${{ github.repository }}"
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: MarCNC-linux
          path: salida/*
          retention-days: 1

  # las dos compilaciones subieron sus paquetes: el borrador se publica
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
