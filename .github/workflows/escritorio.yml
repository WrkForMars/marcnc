name: App de escritorio (Windows)

# Compila GrabaCNC.exe (portable) y el instalador. Con una etiqueta v* (p. ej. v0.3.0) además publica un Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - name: Reunir archivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force salida | Out-Null
          Copy-Item src-tauri/target/release/grabacnc.exe salida/GrabaCNC-portable.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe salida/
          Get-ChildItem salida
      - uses: actions/upload-artifact@v4
        with:
          name: GrabaCNC-windows
          path: salida/*.exe
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" salida/*.exe --title "GrabaCNC ${{ github.ref_name }}" --generate-notes
